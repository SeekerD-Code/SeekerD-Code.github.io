<!DOCTYPE html>
<html lang="it">
<head>
    <link rel="icon" type="image/png" href="/Favicon SDC.ico">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>{{ page.title }}</title>
    <meta name="description" content="{{ page.description }}">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredericka+the+Great&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/style.css">
	<link rel="stylesheet" href="/style-blog-mobile.css">
	
    <script>
        // Il tuo script di controllo Developer Mode e AdSense
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('developer') === 'true') {
            sessionStorage.setItem('devMode', 'true');
        }
        const isDeveloper = sessionStorage.getItem('devMode') === 'true';

        if (window.location.protocol !== 'file:' && !isDeveloper) {
            const adsenseScript = document.createElement('script');
            adsenseScript.async = true;
            adsenseScript.src = "https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9544811471414500";
            adsenseScript.crossOrigin = "anonymous";
            document.head.appendChild(adsenseScript);
        } else {
            console.log("🛠️ Modalità Sviluppatore attiva: AdSense bloccato in questa scheda.");
        }
    </script>
</head>
<body>

    {% include header-menu.html %}

    {{ content }}

    <script src="/banners.js"></script>
    <script src="/script.js"></script>
</body>
</html>
